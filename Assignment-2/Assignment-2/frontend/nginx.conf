server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS; resolving at request time lets nginx start
    # even if the gateway isn't up yet.
    resolver 127.0.0.11 valid=10s;

    # The console pings this to confirm it is talking to the platform.
    location = /api/console {
        default_type application/json;
        return 200 '{"console":"food-delivery"}';
    }

    location /api/ {
        set $gateway http://gateway:8080;
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
