apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/kaptain-codes/distributed-systems-applications/gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - name: BAL_CONFIG_DATA
              value: |
                redisHost = "gateway-redis"
                redisPort = 6379
                redisPassword = ""
                orderService = "http://order-service:9090"
                customerService = "http://customer-service:9090"
                restaurantService = "http://restaurant-service:9090"
                paymentService = "http://payment-service:9090"
                deliveryService = "http://delivery-service:9090"
                notificationService = "http://notification-service:9090"
                adminService = "http://admin-service:9090"
                downstreamTimeout = 10
          resources:
            requests: {cpu: "100m", memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector: {app: gateway}
  ports: [{name: http, port: 80, targetPort: http}]
