apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector: {matchLabels: {app: customer-service}}
  template:
    metadata: {labels: {app: customer-service}}
    spec:
      containers:
        - name: customer-service
          image: ghcr.io/kaptain-codes/distributed-systems-applications/customer-service:latest
          ports: [{name: http, containerPort: 9090}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - {name: CUSTOMER_DB_APP_PASSWORD, valueFrom: {secretKeyRef: {name: database-credentials, key: CUSTOMER_DB_APP_PASSWORD}}}
            - name: BAL_CONFIG_DATA
              value: |
                kafkaRuntimeEnabled = true
                kafkaBootstrap = "kafka:9092"
                durableStateEnabled = true
                mysqlHost = "customer-db"
                mysqlPort = 3306
                mysqlDatabase = "customer"
                mysqlUser = "customer_app"
                mysqlPassword = "$(CUSTOMER_DB_APP_PASSWORD)"
          resources:
            requests: {cpu: "100m", memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe: {httpGet: {path: /customer/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /customer/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: customer-service}
spec:
  selector: {app: customer-service}
  ports: [{name: http, port: 9090, targetPort: http}]
---
