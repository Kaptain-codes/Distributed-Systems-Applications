apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector: {matchLabels: {app: order-service}}
  template:
    metadata: {labels: {app: order-service}}
    spec:
      containers:
        - name: order-service
          image: ghcr.io/kaptain-codes/distributed-systems-applications/order-service:latest
          ports: [{name: http, containerPort: 9090}]
