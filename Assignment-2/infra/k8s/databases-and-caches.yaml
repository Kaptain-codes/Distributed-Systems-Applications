apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: customer-db}
  template:
    metadata:
      labels: {app: customer-db}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mysql
          image: mysql:8.4
          ports: [{name: mysql, containerPort: 3306}]
          # MySQL's official entrypoint initializes the data directory as root.
          # Keep privilege escalation disabled while retaining root startup.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0
          env:
            - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: database-credentials, key: CUSTOMER_DB_PASSWORD}}}
            - {name: MYSQL_DATABASE, value: customer}
            - {name: MYSQL_USER, value: customer_app}
            - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: database-credentials, key: CUSTOMER_DB_APP_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
          resources: {requests: {cpu: "100m", memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          readinessProbe: {exec: {command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent']}, initialDelaySeconds: 30, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: customer-db-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: customer-db
spec:
  selector: {app: customer-db}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
---
