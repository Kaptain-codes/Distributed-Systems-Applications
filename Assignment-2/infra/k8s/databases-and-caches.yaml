apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: order-db}
  template:
    metadata:
      labels: {app: order-db}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mongodb
          image: mongo:7.0
          ports: [{name: mongodb, containerPort: 27017}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: {secretKeyRef: {name: database-credentials, key: MONGO_ROOT_USER}}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: database-credentials, key: ORDER_DB_PASSWORD}}
            - name: MONGO_APP_USER
              value: order_app
            - name: MONGO_APP_PASSWORD
              valueFrom: {secretKeyRef: {name: database-credentials, key: ORDER_DB_APP_PASSWORD}}
            - name: MONGO_APP_DATABASE
              value: orders
          volumeMounts: [{name: data, mountPath: /data/db}]
          resources:
            requests: {cpu: "100m", memory: 512Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec:
              command: [sh, -c, 'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ping: 1})"']
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes: [{name: data, persistentVolumeClaim: {claimName: order-db-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
spec:
  selector: {app: order-db}
  ports: [{name: mongodb, port: 27017, targetPort: mongodb}]
---
