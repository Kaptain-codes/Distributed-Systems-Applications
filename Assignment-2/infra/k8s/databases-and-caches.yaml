apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
type: Opaque
stringData:
  MONGO_ROOT_USER: dev_admin
  ORDER_DB_PASSWORD: CHANGE_ME_ORDER_ROOT
  ORDER_DB_APP_PASSWORD: CHANGE_ME_ORDER_APP
  CUSTOMER_DB_PASSWORD: CHANGE_ME_CUSTOMER_ROOT
  CUSTOMER_DB_APP_PASSWORD: CHANGE_ME_CUSTOMER_APP
  RESTAURANT_DB_PASSWORD: CHANGE_ME_RESTAURANT_ROOT
  RESTAURANT_DB_APP_PASSWORD: CHANGE_ME_RESTAURANT_APP
  PAYMENT_DB_PASSWORD: CHANGE_ME_PAYMENT_ROOT
  PAYMENT_DB_APP_PASSWORD: CHANGE_ME_PAYMENT_APP
  DELIVERY_DB_PASSWORD: CHANGE_ME_DELIVERY_SA
  NOTIFICATION_DB_PASSWORD: CHANGE_ME_NOTIFICATION_ROOT
  NOTIFICATION_DB_APP_PASSWORD: CHANGE_ME_NOTIFICATION_APP
  ADMIN_DB_PASSWORD: CHANGE_ME_ADMIN_ROOT
  ADMIN_DB_APP_PASSWORD: CHANGE_ME_ADMIN_APP
---
