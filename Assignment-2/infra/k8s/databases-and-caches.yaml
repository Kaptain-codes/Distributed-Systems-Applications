apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-db
spec:
  replicas: 1
  selector:
    matchLabels: {app: delivery-db}
  template:
    metadata:
      labels: {app: delivery-db}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
          ports: [{name: mssql, containerPort: 1433}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
          env:
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: MSSQL_SA_PASSWORD, valueFrom: {secretKeyRef: {name: database-credentials, key: DELIVERY_DB_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/opt/mssql}]
          # SQL Server 2022 needs ~2Gi minimum to start
          resources: {requests: {cpu: "100m", memory: 2Gi}, limits: {cpu: "1", memory: 4Gi}}
          readinessProbe: {tcpSocket: {port: mssql}, initialDelaySeconds: 45, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: delivery-db-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-db
spec:
  selector: {app: delivery-db}
  ports: [{name: mssql, port: 1433, targetPort: mssql}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-redis
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway-redis}
  template:
    metadata:
      labels: {app: gateway-redis}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: redis
          image: redis:7.4-alpine
          ports: [{name: redis, containerPort: 6379}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
          args: [redis-server, --appendonly, "yes"]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: "25m", memory: 128Mi}, limits: {cpu: "250m", memory: 256Mi}}
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 5}
      volumes: [{name: data, persistentVolumeClaim: {claimName: gateway-redis-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-redis
spec:
  selector: {app: gateway-redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
