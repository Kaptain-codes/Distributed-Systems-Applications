# NOTE: the top-level `version:` key is deprecated in current Compose —
# safe to delete if you want to silence the startup warning. Left out here.

networks:
  backbone:
    driver: bridge

services:

  # ---------------------------------------------------------------
  # Kafka event bus (Zookeeper mode)
  # ---------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    profiles: ["order-customer", "restaurant-payment", "delivery", "notification-admin", "all"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    cpus: "1.0"
    ports:
      - "127.0.0.1:${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      # TCP-only check. The `ruok` 4-letter-word command never worked on
      # this image despite ZOOKEEPER_4LW_COMMANDS_WHITELIST being set
      # correctly on the container — confirmed via
      # `docker exec ... cat /etc/kafka/zookeeper.properties` showing the
      # whitelist line was never written to the generated properties file.
      # This just confirms the client port is open, which logs confirmed
      # is a reliable proxy for zookeeper being ready.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/2181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backbone]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["order-customer", "restaurant-payment", "delivery", "notification-admin", "all"]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    mem_limit: 1g
    cpus: "2.0"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      # timeout bumped 5s -> 15s: kafka-topics is a JVM CLI with its own
      # startup overhead, and 5s wasn't reliably enough once 20+ containers
      # were competing for CPU/memory at once (confirmed via
      # `docker inspect ... .State.Health` showing "exceeded timeout (5s)"
      # on every failed attempt even though a manual run succeeded instantly).
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 30s
    networks: [backbone]

  # ---------------------------------------------------------------
  # Creates required Kafka topics once the broker is healthy.
  # ---------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["order-customer", "restaurant-payment", "delivery", "notification-admin", "all"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/create-topics.sh:/opt/app/create-topics.sh:ro
    command: ["/bin/bash", "/opt/app/create-topics.sh"]
    networks: [backbone]

  # ---------------------------------------------------------------
  # API gateway
  # ---------------------------------------------------------------
  gateway:
    build: ../../gateway
    profiles: ["order-customer", "restaurant-payment", "delivery", "notification-admin", "all"]
    mem_limit: 512m
    cpus: "1.0"
    environment:
      BAL_CONFIG_DATA: |
        redisHost = "gateway-redis"
        redisPort = 6379
        redisPassword = "${GATEWAY_REDIS_PASSWORD:-}"
        orderService = "http://order-service:9090"
        customerService = "http://customer-service:9090"
        restaurantService = "http://restaurant-service:9090"
        paymentService = "http://payment-service:9090"
        deliveryService = "http://delivery-service:9090"
        notificationService = "http://notification-service:9090"
        adminService = "http://admin-service:9090"
        downstreamTimeout = ${GATEWAY_DOWNSTREAM_TIMEOUT:-10}
    depends_on:
      gateway-redis:
        condition: service_started
      order-service:
        condition: service_started
        required: false
      customer-service:
        condition: service_started
        required: false
      notification-service:
        condition: service_started
        required: false
      admin-service:
        condition: service_started
        required: false
      payment-service:
        condition: service_started
        required: false
      restaurant-service:
        condition: service_started
        required: false
      delivery-service:
        condition: service_started
        required: false
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  gateway-redis:
    image: redis:7.4-alpine
    profiles: ["order-customer", "restaurant-payment", "delivery", "notification-admin", "all"]
    ports:
      - "127.0.0.1:${GATEWAY_REDIS_PORT:-6379}:6379"
    volumes:
      - gateway-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backbone]

  # Wilgano
  order-service:
    build: ../../services/orderService
    profiles: ["order-customer", "all"]
    mem_limit: 512m
    cpus: "1.0"
    environment:
      BAL_CONFIG_DATA: |
        kafkaRuntimeEnabled = true
        kafkaBootstrap = "kafka:9092"
        durableStateEnabled = true
        testFailurePoint = "${ORDER_TEST_FAILURE_POINT:-}"
        testFailureEventId = "${ORDER_TEST_FAILURE_EVENT_ID:-}"
        mongoUri = "mongodb://order_app:${ORDER_DB_APP_PASSWORD}@order-db:27017/orders?authSource=orders"
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-8081}:9090"
    depends_on:
      kafka-init:
        condition: service_started
      order-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/order/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  customer-service:
    # NOTE: folder is services/customerService — NOT userService, despite
    # some earlier scaffolding/naming referring to it as "user service".
    build: ../../services/customerService
    profiles: ["order-customer", "all"]
    ports:
      - "127.0.0.1:${CUSTOMER_SERVICE_PORT:-8082}:9090"
    depends_on:
      kafka-init:
        condition: service_started
      customer-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/customer/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  # Sholm
  admin-service:
    build: ../../services/adminService
    profiles: ["notification-admin", "all"]
    mem_limit: 512m
    cpus: "1.0"
    ports:
      - "127.0.0.1:${ADMIN_SERVICE_PORT:-8085}:9090"
    environment:
      BAL_CONFIG_DATA: |
        kafkaRuntimeEnabled = true
        kafkaBootstrap = "kafka:9092"
        durableStateEnabled = true
        mongoUri = "mongodb://${ADMIN_DB_USER:-admin_app}:${ADMIN_DB_APP_PASSWORD}@admin-db:27017/${ADMIN_DB_NAME:-admin}?authSource=${ADMIN_DB_NAME:-admin}"
    depends_on:
      kafka-init:
        condition: service_started
      admin-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  notification-service:
    build: ../../services/notificationService
    profiles: ["notification-admin", "all"]
    mem_limit: 512m
    cpus: "1.0"
    environment:
      BAL_CONFIG_DATA: |
        kafkaRuntimeEnabled = true
        kafkaBootstrap = "kafka:9092"
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_PORT:-8083}:9090"
    depends_on:
      kafka-init:
        condition: service_started
      notification-db:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/notification/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  notification-redis:
    image: redis:7.4-alpine
    profiles: ["notification-admin", "all"]
    volumes:
      - notification-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backbone]

  # Emmanuel
  payment-service:
    build: ../../services/paymentService
    profiles: ["restaurant-payment", "all"]
    mem_limit: 512m
    cpus: "1.0"
    environment:
      BAL_CONFIG_DATA: |
        kafkaRuntimeEnabled = true
        kafkaBootstrap = "kafka:9092"
    ports:
      - "127.0.0.1:${PAYMENT_SERVICE_PORT:-8084}:9090"
    depends_on:
      kafka-init:
        condition: service_started
      payment-db:
        condition: service_healthy
      payment-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/payment/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  restaurant-service:
    build: ../../services/restaurantService
    profiles: ["restaurant-payment", "all"]
    mem_limit: 512m
    cpus: "1.0"
    environment:
      BAL_CONFIG_DATA: |
        kafkaRuntimeEnabled = true
        kafkaBootstrap = "kafka:9092"
    ports:
      - "127.0.0.1:${RESTAURANT_SERVICE_PORT:-8087}:9090"
    depends_on:
      kafka-init:
        condition: service_started
      restaurant-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/restaurant/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  payment-redis:
    image: redis:7.4-alpine
    profiles: ["restaurant-payment", "all"]
    volumes:
      - payment-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [backbone]

  # Ikuaa
  delivery-service:
    build: ../../services/deliveryService
    profiles: ["delivery", "all"]
    mem_limit: 512m
    cpus: "1.0"
    environment:
      BAL_CONFIG_DATA: |
        kafkaRuntimeEnabled = true
        kafkaBootstrap = "kafka:9092"
    ports:
      - "127.0.0.1:${DELIVERY_SERVICE_PORT:-8086}:9090"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      delivery-db:
        condition: service_healthy
      delivery-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9090/delivery/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backbone]

  # Wilgano
  order-db:
    image: mongo:7.0
    profiles: ["order-customer", "all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD in .env}
      MONGO_APP_USER: ${ORDER_DB_USER:-order_app}
      MONGO_APP_PASSWORD: ${ORDER_DB_APP_PASSWORD:?Set ORDER_DB_APP_PASSWORD in .env}
      MONGO_APP_DATABASE: ${ORDER_DB_NAME:-orders}
    ports:
      - "127.0.0.1:${ORDER_DB_PORT:-27017}:27017"
    volumes:
      - "order-db-data:/data/db"
      - ./initdb/order-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backbone]

  customer-db:
    image: mysql:8.4
    profiles: ["order-customer", "all"]
    environment:
      MYSQL_ROOT_PASSWORD: ${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD in .env}
      MYSQL_DATABASE: ${CUSTOMER_DB_NAME:-customer}
      MYSQL_USER: ${CUSTOMER_DB_USER:-customer_app}
      MYSQL_PASSWORD: ${CUSTOMER_DB_APP_PASSWORD:?Set CUSTOMER_DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CUSTOMER_DB_PORT:-1434}:3306"
    volumes:
      - "customer-db-data:/var/lib/mysql"
      - ./initdb/customer-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backbone]

  # Emmanuel
  restaurant-db:
    image: mysql:8.4
    profiles: ["restaurant-payment", "all"]
    environment:
      MYSQL_ROOT_PASSWORD: ${RESTAURANT_DB_PASSWORD:?Set RESTAURANT_DB_PASSWORD in .env}
      MYSQL_DATABASE: ${RESTAURANT_DB_NAME:-restaurant}
      MYSQL_USER: ${RESTAURANT_DB_USER:-restaurant_app}
      MYSQL_PASSWORD: ${RESTAURANT_DB_APP_PASSWORD:?Set RESTAURANT_DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RESTAURANT_DB_PORT:-1435}:3306"
    volumes:
      - "restaurant-db-data:/var/lib/mysql"
      - ./initdb/restaurant-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backbone]

  payment-db:
    image: mysql:8.4
    profiles: ["restaurant-payment", "all"]
    environment:
      MYSQL_ROOT_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      MYSQL_DATABASE: ${PAYMENT_DB_NAME:-payment}
      MYSQL_USER: ${PAYMENT_DB_USER:-payment_app}
      MYSQL_PASSWORD: ${PAYMENT_DB_APP_PASSWORD:?Set PAYMENT_DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PAYMENT_DB_PORT:-1436}:3306"
    volumes:
      - "payment-db-data:/var/lib/mysql"
      - ./initdb/payment-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backbone]

  # Ikuaa
  delivery-db:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    profiles: ["delivery", "all"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DELIVERY_DB_PORT:-1437}:1433"
    volumes:
      - "delivery-db-data:/var/opt/mssql"
    healthcheck:
      # mssql-tools18 needs -C to trust the image's self-signed cert.
      # If your image still ships the older mssql-tools, use
      # /opt/mssql-tools/bin/sqlcmd instead and drop -C.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks: [backbone]

  delivery-db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    profiles: ["delivery", "all"]
    restart: "no"
    depends_on:
      delivery-db:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${DELIVERY_DB_PASSWORD:?Set DELIVERY_DB_PASSWORD in .env}
    command: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "delivery-db", "-U", "sa", "-C", "-b", "-Q", "IF DB_ID('delivery') IS NULL CREATE DATABASE delivery;"]
    networks: [backbone]

  # Sholm
  notification-db:
    image: mongo:7.0
    profiles: ["notification-admin", "all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      MONGO_APP_USER: ${NOTIFICATION_DB_USER:-notification_app}
      MONGO_APP_PASSWORD: ${NOTIFICATION_DB_APP_PASSWORD:?Set NOTIFICATION_DB_APP_PASSWORD in .env}
      MONGO_APP_DATABASE: ${NOTIFICATION_DB_NAME:-notifications}
    ports:
      - "127.0.0.1:${NOTIFICATION_DB_PORT:-27018}:27017"
    volumes:
      - "notification-db-data:/data/db"
      - ./initdb/notification-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backbone]

  admin-db:
    image: mongo:7.0
    profiles: ["notification-admin", "all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${ADMIN_DB_PASSWORD:?Set ADMIN_DB_PASSWORD in .env}
      MONGO_APP_USER: ${ADMIN_DB_USER:-admin_app}
      MONGO_APP_PASSWORD: ${ADMIN_DB_APP_PASSWORD:?Set ADMIN_DB_APP_PASSWORD in .env}
      MONGO_APP_DATABASE: ${ADMIN_DB_NAME:-admin}
    ports:
      - "127.0.0.1:${ADMIN_DB_PORT:-27019}:27017"
    volumes:
      - "admin-db-data:/data/db"
      - ./initdb/admin-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backbone]

volumes:
  order-db-data:
  restaurant-db-data:
  payment-db-data:
  delivery-db-data:
  customer-db-data:
  notification-db-data:
  admin-db-data:
  payment-redis-data:
  notification-redis-data:
  gateway-redis-data:
